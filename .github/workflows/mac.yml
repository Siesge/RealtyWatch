# Проверка форка RealtyWatch_Mac на настоящем Mac (раннеры GitHub — железо Apple, Apple Silicon).
# Эмулятор macOS на PC дал бы только Intel и программный рендеринг, здесь же всё по-настоящему:
# доставка среды, тесты, сборка .app и запуск сервера.
name: macOS

on:
  push:
    branches: [main]
    paths: ["RealtyWatch_Mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15          # Apple Silicon (M1); macos-26 — следующая версия системы
    timeout-minutes: 40
    defaults:
      run:
        working-directory: RealtyWatch_Mac
    steps:
      - uses: actions/checkout@v7

      - name: Какой это Mac
        run: |
          sw_vers
          echo "процессор: $(uname -m), bash: $BASH_VERSION"

      - name: Доставить среду (uv, Python, библиотеки, Chromium)
        run: bash bin/bootstrap.sh

      - name: Повторный запуск установщика ничего не доставляет
        run: |
          if bash bin/bootstrap.sh --check; then
            echo "среда на месте, второй раз ничего не качается"
          else
            echo "установщик не узнаёт свою же среду — смотреть метку runtime/installed.txt"
            exit 1
          fi

      - name: Тесты
        run: |
          PY="$HOME/Library/Application Support/RealtyWatch/runtime/venv/bin/python"
          "$PY" -m unittest discover -s tests -t . -v

      - name: Собрать RealtyWatch.app
        run: ./build_app.sh

      - name: Бандл собран целиком
        run: |
          APP="dist/RealtyWatch.app"
          [ -x "$APP/Contents/MacOS/RealtyWatch" ] || { echo "запускатор не исполняемый"; exit 1; }
          [ -s "$APP/Contents/Resources/icon.icns" ] || { echo "иконка не собралась"; exit 1; }
          [ -f "$APP/Contents/Resources/app/main.py" ] || { echo "кода нет внутри бандла"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Contents/Info.plist"
          codesign -dv "$APP" 2>&1 | head -3
          du -sh "$APP"

      - name: Программа запускается и отдаёт интерфейс
        run: |
          PY="$HOME/Library/Application Support/RealtyWatch/runtime/venv/bin/python"
          "$PY" -m app.main --server &
          SRV=$!
          for _ in $(seq 1 30); do
            if ! kill -0 "$SRV" 2>/dev/null; then echo "сервер завершился сам"; break; fi
            if curl -fsS http://127.0.0.1:8765/api/settings > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/api/settings | head -c 200
          echo
          curl -fsS http://127.0.0.1:8765/ | grep -q "<title>RealtyWatch</title>"
          echo "интерфейс отдаётся"
          kill "$SRV" 2>/dev/null || true

      - name: Журналы, если что-то пошло не так
        if: failure()
        run: |
          cat "$HOME/Library/Application Support/RealtyWatch/logs/"*.log || true
          ls -la "$HOME/Library/Application Support/RealtyWatch" || true

      - name: Упаковать .app (ditto сохраняет права на запуск)
        run: ditto -c -k --sequesterRsrc --keepParent dist/RealtyWatch.app dist/RealtyWatch.zip

      - name: Собрать RealtyWatch.dmg — его и пересылают
        run: |
          ./build_dmg.sh
          hdiutil verify dist/RealtyWatch.dmg
          du -h dist/RealtyWatch.dmg
          # образ не просто целый: внутри лежит запускаемое приложение и ярлык, на который его тянут
          hdiutil attach dist/RealtyWatch.dmg -nobrowse -readonly -mountpoint /tmp/rw-dmg
          ls -l /tmp/rw-dmg
          [ -x /tmp/rw-dmg/RealtyWatch.app/Contents/MacOS/RealtyWatch ] || { echo "в образе нет запускаемого приложения"; exit 1; }
          [ -L "/tmp/rw-dmg/Программы" ] || { echo "в образе нет ярлыка Программ"; exit 1; }
          hdiutil detach /tmp/rw-dmg

      - uses: actions/upload-artifact@v7
        with:
          name: RealtyWatch-dmg
          path: RealtyWatch_Mac/dist/RealtyWatch.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: RealtyWatch-app
          path: RealtyWatch_Mac/dist/RealtyWatch.zip

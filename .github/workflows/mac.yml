# Проверка форка RealtyWatch_Mac на настоящем Mac (раннеры GitHub — железо Apple, Apple Silicon).
# Эмулятор macOS на PC дал бы только Intel и программный рендеринг, здесь же всё по-настоящему:
# доставка среды, тесты, сборка .app и запуск сервера.
name: macOS

# Запуск сужен по решению владельца (8 ноября 2026): за 2–7 ноября 26 прогонов съели около 1000
# оплачиваемых минут из 2000 бесплатных в месяц — macOS на приватном репозитории считается ×10.
# Пуш с кодом гонит быстрый набор и всю сборку; браузерные тесты (три четверти времени набора) —
# по кнопке «Run workflow» и обязательно перед выпуском; правка одних записей не гонит ничего.
on:
  push:
    branches: [main]
    paths:
      - "RealtyWatch_Mac/**"
      - ".github/workflows/mac.yml"
      - "!RealtyWatch_Mac/**.md"   # разметку тесты не читают, прогона она не стоит
  workflow_dispatch:
    inputs:
      version:
        description: "Номер версии в Info.plist, например 1.0. Пусто — дата сборки."
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15          # Apple Silicon (M1); macos-26 — следующая версия системы
    timeout-minutes: 40
    defaults:
      run:
        working-directory: RealtyWatch_Mac
    steps:
      - uses: actions/checkout@v7

      - name: Какой это Mac
        run: |
          sw_vers
          echo "процессор: $(uname -m), bash: $BASH_VERSION"

      - name: Доставить среду (uv, Python, библиотеки, Chromium)
        run: bash bin/bootstrap.sh

      - name: Повторный запуск установщика ничего не доставляет
        run: |
          if bash bin/bootstrap.sh --check; then
            echo "среда на месте, второй раз ничего не качается"
          else
            echo "установщик не узнаёт свою же среду — смотреть метку runtime/installed.txt"
            exit 1
          fi

      # Браузерные тесты поднимают настоящий Chromium: в прогоне 42429456923 это 222 секунды из 255.
      # На пуш они пропускаются (RW_SKIP_BROWSER_TESTS в tests/support.py), по кнопке — гонятся все.
      # Совсем без них остаться нельзя: оба найденных дефекта — промах по «следующей странице» и
      # отпускание ползунка капчи на ходу — вылезли именно на занятом macos-раннере и больше нигде.
      # Осторожно с выражением ниже: пустая строка в Actions ложна, поэтому '' стоит только после
      # ||, где возвращается последний операнд. Поставить его до && — и переменная всегда '1'.
      - name: Тесты
        env:
          RW_SKIP_BROWSER_TESTS: ${{ github.event_name != 'workflow_dispatch' && '1' || '' }}
        run: |
          set -o pipefail
          PY="$HOME/Library/Application Support/RealtyWatch/runtime/venv/bin/python"
          LOG="$RUNNER_TEMP/tests.log"
          # Ошибка в выражении выше была бы незаметна: проверки ниже сверяют журнал с переменной,
          # и выключенные по ошибке браузерные тесты дали бы зелёный прогон. Поэтому сверяем ещё и
          # с самим событием — кнопка обязана гнать их, что бы в переменную ни попало.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$RW_SKIP_BROWSER_TESTS" ]; then
            echo "запуск по кнопке обязан гнать браузерные тесты, а переменная их выключила"
            exit 1
          fi
          if [ -n "$RW_SKIP_BROWSER_TESTS" ]; then
            echo "быстрый набор: браузерные тесты пропускаются нарочно. Нужны — «Run workflow»."
          else
            echo "полный набор, вместе с браузерными"
            # Загрузку пишем всё время, а не до и после: браузерные тесты идут в середине набора,
            # и мерка «до» показала бы хвост доставки среды. Actions метит каждую строку временем,
            # поэтому видно, чем была занята машина под нужным тестом.
            ( while :; do echo "нагрузка: $(uptime)"; sleep 20; done ) &
            trap 'kill %1 2>/dev/null || true' EXIT
          fi
          "$PY" -m unittest discover -s tests -t . -v 2>&1 | tee "$LOG"
          # Пропуск — это способ прогону тихо позеленеть, поэтому сверяем, что пропустилось ровно то,
          # что задумано. «Chromium не установлен» означает поломку установщика в любом прогоне.
          # Ищем ASCII-хвосты причин, а не русский текст: grep тогда не зависит от того,
          # в какой кодировке unittest напечатал строку пропуска.
          if grep -q "skipped '.*bootstrap\.sh)'" "$LOG"; then
            echo "браузерные тесты пропустились не нарочно — Chromium не доставлен установщиком"
            exit 1
          fi
          if [ -n "$RW_SKIP_BROWSER_TESTS" ]; then
            grep -q "skipped '.*RW_SKIP_BROWSER_TESTS'" "$LOG" || {
              echo "браузерные тесты должны были пропуститься, а в журнале их пропуска нет"; exit 1; }
          elif grep -q "\.\.\. skipped '" "$LOG"; then
            echo "в полном прогоне пропусков быть не должно:"
            grep -n "\.\.\. skipped '" "$LOG"
            exit 1
          fi

      - name: Собрать RealtyWatch.app
        env:
          RW_VERSION: ${{ inputs.version }}
        run: ./build_app.sh

      - name: Бандл собран целиком
        run: |
          APP="dist/RealtyWatch.app"
          [ -x "$APP/Contents/MacOS/RealtyWatch" ] || { echo "запускатор не исполняемый"; exit 1; }
          [ -s "$APP/Contents/Resources/icon.icns" ] || { echo "иконка не собралась"; exit 1; }
          [ -f "$APP/Contents/Resources/app/main.py" ] || { echo "кода нет внутри бандла"; exit 1; }
          # version.txt — из него окно «О программе» берёт номер версии
          V="$APP/Contents/Resources/version.txt"
          [ -s "$V" ] || { echo "version.txt не положен в бандл"; exit 1; }
          cat "$V"
          grep -q '^RealtyWatch ' "$V" || { echo "version.txt начинается не с имени — about.py не разберёт"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist"
          codesign -dv "$APP" 2>&1 | head -3
          du -sh "$APP"

      - name: Программа запускается и отдаёт интерфейс
        run: |
          PY="$HOME/Library/Application Support/RealtyWatch/runtime/venv/bin/python"
          "$PY" -m app.main --server &
          SRV=$!
          for _ in $(seq 1 30); do
            if ! kill -0 "$SRV" 2>/dev/null; then echo "сервер завершился сам"; break; fi
            if curl -fsS http://127.0.0.1:8765/api/settings > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8765/api/settings | head -c 200
          echo
          curl -fsS http://127.0.0.1:8765/ | grep -q "<title>RealtyWatch</title>"
          echo "интерфейс отдаётся"
          # окно «О программе»: версии библиотек и Chromium берутся с живой среды
          curl -fsS http://127.0.0.1:8765/api/about > /tmp/about.json
          "$PY" -c 'import json; d=json.load(open("/tmp/about.json")); v={i["name"]: i["version"] for g in d["groups"] for i in g["items"]}; print("о программе:", d["author"], "|", d["version"] or "без номера версии"); print("версии:", {k: x for k, x in v.items() if x}); assert v["Python"] and v["Chromium"], "версии среды не определились"; assert not [k for k, x in v.items() if k in ("pythonnet", "pystray")], "в списке лицензий остались библиотеки Windows"'
          # выгрузка избранного: на пустой базе эндпоинт должен сказать «пусто», а не упасть
          CODE="$(curl -s -o /tmp/liked.json -w '%{http_code}' -X POST http://127.0.0.1:8765/api/liked/export)"
          cat /tmp/liked.json; echo
          [ "$CODE" = "400" ] || { echo "ожидали 400 на пустом избранном, получили $CODE"; exit 1; }
          echo "экспорт избранного на месте"
          # «Очистка данных»: список резервных копий и выбор отдельных прогонов
          curl -fsS http://127.0.0.1:8765/api/db/backups > /tmp/backups.json
          "$PY" -c 'import json; d=json.load(open("/tmp/backups.json")); assert set(d) >= {"items", "count", "bytes", "mb", "folder", "trash"}, d; print("копии:", d["count"], "шт.,", d["mb"], "МБ |", d["folder"], "| уйдут в Корзину:", d["trash"])'
          curl -fsS "http://127.0.0.1:8765/api/db/launches?from=2026-01-01&to=2026-12-31" > /tmp/launches.json
          "$PY" -c 'import json; d=json.load(open("/tmp/launches.json")); assert isinstance(d, list), d; print("запусков в окне:", len(d))'
          echo "очистка данных отвечает"
          kill "$SRV" 2>/dev/null || true

      # Корзина на macOS делается не одной командой, а тремя способами по очереди (app/trash.py).
      # Какой из них живой, зависит от того, что принесла с собой сборка, — поэтому спрашиваем
      # у настоящего Мака. Ничего не удаляем: route/available/count только смотрят.
      - name: Корзина macOS — каким способом уйдут резервные копии
        run: |
          PY="$HOME/Library/Application Support/RealtyWatch/runtime/venv/bin/python"
          "$PY" -c 'from pathlib import Path; from app import trash; r = trash.route(); print("способ:", r); print("Корзина доступна:", trash.available(Path.home()), "| в ней сейчас:", trash.count(Path.home())); assert r, "ни один способ не доступен — копии будут стираться насовсем"'

      - name: Всё лежит в одной папке
        run: |
          du -sh "$HOME/Library/Application Support/RealtyWatch"/*
          for p in "$HOME/Library/Caches/uv" "$HOME/.cache/uv" "$HOME/Library/Caches/ms-playwright" "$HOME/.local/share/uv"; do
            if [ -e "$p" ]; then echo "осталось снаружи: $p"; exit 1; fi
          done
          echo "снаружи рабочей папки ничего не осталось"

      - name: Журналы, если что-то пошло не так
        if: failure()
        run: |
          cat "$HOME/Library/Application Support/RealtyWatch/logs/"*.log || true
          ls -la "$HOME/Library/Application Support/RealtyWatch" || true

      - name: Упаковать .app (ditto сохраняет права на запуск)
        run: ditto -c -k --sequesterRsrc --keepParent dist/RealtyWatch.app dist/RealtyWatch.zip

      - name: Собрать RealtyWatch.dmg — его и пересылают
        run: |
          ./build_dmg.sh
          hdiutil verify dist/RealtyWatch.dmg
          du -h dist/RealtyWatch.dmg
          # образ не просто целый: внутри лежит запускаемое приложение и ярлык, на который его тянут
          hdiutil attach dist/RealtyWatch.dmg -nobrowse -readonly -mountpoint /tmp/rw-dmg
          ls -l /tmp/rw-dmg
          [ -x /tmp/rw-dmg/RealtyWatch.app/Contents/MacOS/RealtyWatch ] || { echo "в образе нет запускаемого приложения"; exit 1; }
          [ -L "/tmp/rw-dmg/Программы" ] || { echo "в образе нет ярлыка Программ"; exit 1; }
          hdiutil detach /tmp/rw-dmg

      - uses: actions/upload-artifact@v7
        with:
          name: RealtyWatch-dmg
          path: RealtyWatch_Mac/dist/RealtyWatch.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: RealtyWatch-app
          path: RealtyWatch_Mac/dist/RealtyWatch.zip

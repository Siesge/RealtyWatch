<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RealtyWatch</title>
<link rel="icon" href="/static/icon.png">
<link rel="stylesheet" href="/static/vendor/leaflet/leaflet.min.css">
<link rel="stylesheet" href="/static/app.css">
<script>
  // тема до отрисовки, чтобы не было вспышки
  try { const t = localStorage.getItem("rw.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <img src="/static/icon.png" alt="">
      <div><div class="brand-name">RealtyWatch</div><div class="brand-sub">Ялта · квартиры</div></div>
    </div>

    <nav class="nav">
      <button data-view="cards" class="active"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Подборка</button>
      <button data-view="table"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Таблица</button>
      <button data-view="map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Карта</button>
      <button data-view="runs"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="8.5"/></svg>Прогоны</button>
      <button data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Настройки</button>
    </nav>

    <section class="collect">
      <div class="side-label">Сбор данных</div>
      <div id="sources"></div>
      <div class="run-actions">
        <button id="btnRun" class="btn-run"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg>Запустить</button>
        <button id="btnStop" class="btn-stop" title="Остановить"><svg viewBox="0 0 24 24"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg></button>
      </div>
    </section>

    <div class="side-foot">
      <button id="jToggle" class="foot-btn"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg>Журнал<span id="jDot" class="dot hidden"></span></button>
      <div class="theme" id="theme">
        <button data-t="light" title="Светлая"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
        <button data-t="" title="Как в системе"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M9 20h6"/></svg></button>
        <button data-t="dark" title="Тёмная"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="heading">
        <h1 id="viewTitle">Подборка</h1>
        <div class="heading-sub" id="viewSub"></div>
      </div>
      <div class="kpis" id="kpis"></div>
    </header>

    <div class="toolbar" id="filters">
      <div class="tb-row">
        <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input type="search" id="fText" placeholder="Улица, ЖК, слово из описания"></label>
        <label class="like-toggle" title="Показать только избранное"><input type="checkbox" id="fLiked">
          <span><svg viewBox="0 0 24 24"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z"/></svg>Избранное <em id="likeCount"></em></span></label>
        <div class="seg" id="zoneSeg">
          <label><input type="checkbox" name="zone" value="A" checked><span><i class="zdot A"></i>Круг <em id="zc-A"></em></span></label>
          <label><input type="checkbox" name="zone" value="B" checked><span><i class="zdot B"></i>Ялта <em id="zc-B"></em></span></label>
          <label><input type="checkbox" name="zone" value="C"><span><i class="zdot C"></i>Посёлки <em id="zc-C"></em></span></label>
        </div>
        <div class="seg small">
          <label><input type="checkbox" name="rooms" value="1" checked><span>1 к</span></label>
          <label><input type="checkbox" name="rooms" value="2" checked><span>2 к</span></label>
          <label><input type="checkbox" name="rooms" value="3" checked><span>3 к</span></label>
        </div>
        <div class="seg small">
          <label><input type="checkbox" name="src" value="cian" checked><span><i class="sdot cian"></i>ЦИАН</span></label>
          <label><input type="checkbox" name="src" value="avito" checked><span><i class="sdot avito"></i>Авито</span></label>
          <label><input type="checkbox" name="src" value="yandex" checked><span><i class="sdot yandex"></i>Яндекс</span></label>
        </div>
      </div>
      <div class="tb-row">
        <div class="range"><span>Цена, млн</span><input type="number" id="fPmin" step="0.1" placeholder="от"><i>—</i><input type="number" id="fPmax" step="0.1" placeholder="до"></div>
        <div class="range"><span>Площадь</span><input type="number" id="fAmin" placeholder="от, м²"></div>
        <label class="sel"><span>Ремонт</span><select id="fReno"><option value="">любой</option><option value="known">указан</option>
          <option value="design">дизайнерский</option><option value="euro">евро</option><option value="cosmetic">косметический</option>
          <option value="finish">чистовая</option><option value="old">старый</option></select></label>
        <label class="sel"><span>Тип</span><select id="fNew"><option value="">все</option><option value="0">вторичка</option><option value="1">новостройки</option></select></label>
        <label class="sel"><span>Статус</span><select id="fState"><option value="pass">прошли отсев</option><option value="excluded">отсеянные</option><option value="all">все</option></select></label>
        <label class="sel"><span>Сортировка</span><select id="fSort"><option value="new">сначала новые</option><option value="price">дешевле</option><option value="-price">дороже</option><option value="ppm">₽/м² ↑</option><option value="-area">площадь ↓</option></select></label>
        <label class="check"><input type="checkbox" id="fActive" checked><span>активные</span></label>
        <label class="check"><input type="checkbox" id="fNoCoords"><span>без координат</span></label>
        <button id="btnReset" class="link">Сбросить</button>
        <button id="btnSide" class="toggle"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5L9 4z"/></svg>Карта рядом</button>
      </div>
    </div>

    <section id="view-cards" class="view">
      <div id="split" class="split">
        <div id="cardsList"></div>
        <div class="side"><div id="sideMap" class="map"></div></div>
      </div>
    </section>
    <section id="view-table" class="view hidden"></section>
    <section id="view-map" class="view hidden"><div id="map" class="map big"></div></section>
    <section id="view-runs" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>

    <div id="journal" class="journal collapsed">
      <div class="j-head"><span>Журнал</span><span id="jLast" class="j-last"></span><button id="jClose" class="link">Скрыть</button></div>
      <div class="j-body" id="jBody"></div>
    </div>
  </main>
</div>
<div id="toasts" class="toasts"></div>

<script src="/static/vendor/leaflet/leaflet.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
